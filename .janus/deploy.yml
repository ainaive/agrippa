# Janus deploy pipeline — runs on the Agrippa host itself.
#
# Deliberately not .janus/ci.yml (the default path): the GitCode webhook selects
# this file with ?pipeline_path=deploy.yml, which leaves ci.yml free if Janus
# ever runs tests for this repo too, rather than conflating deploy and CI.
#
# That value is relative to the pipeline DIRECTORY, not the repo root — Janus
# joins it onto .janus/ itself (internal/runner/runner.go: "release.yml", not
# ".janus/release.yml"). Passing the full path silently resolves to
# .janus/.janus/deploy.yml and the run fails at checkout with a missing file,
# before any branch filter applies — so a push to ANY branch fails the run
# rather than being skipped. Getting this wrong is not a no-op.
#
# Trigger is the `deploy` branch, not main: main takes doc-only commits, and
# this is the only environment — going live should be a deliberate
# fast-forward, and rolling back is moving the branch.
#
# Janus checks the repo out into its own workspace as the `janus` user; that
# checkout is only the trigger vehicle. The deploy acts on /opt/agrippa, which
# is root-owned and holds the untracked .env. See docs/design/08-deployment.md
# for why the tree is not janus-writable.
name: deploy

on:
  push:
    branches: [deploy]

# Serialize deploys. infra/deploy.sh also takes a flock, which covers manual
# runs that never reach Janus; this stops the queue forming inside the script.
concurrency:
  group: deploy-${{ branch }}

jobs:
  deploy:
    steps:
      # Passing the exact SHA makes the deploy deterministic: it applies the
      # commit that triggered this run, not whatever the branch tip has moved
      # to since.
      #
      # NOT sudo. Janus's own unit sets NoNewPrivileges=true, which every step
      # inherits and which makes setuid a no-op, so `sudo` fails here however
      # the sudoers rule is written ("the no new privileges flag is set, which
      # prevents sudo from running as root"). systemctl asks pid 1 to do the
      # work over D-Bus rather than escalating in-process, so the flag does not
      # apply; polkit authorizes exactly this one unit. See infra/janus/.
      #
      # --wait blocks until the unit finishes and exits non-zero if it failed,
      # so the pipeline still reflects the deploy. The unit logs to a file
      # rather than the journal because the janus user cannot read the journal,
      # and granting it that would expose every unit's logs to every pipeline.
      # cat runs regardless of outcome — a failed deploy is when the log is
      # worth having — and the original status is preserved for Janus.
      - run: |
          systemctl start --wait agrippa-deploy@${{ sha }}.service; rc=$?
          cat /var/log/agrippa-deploy/${{ sha }}.log 2>/dev/null || true
          exit $rc
